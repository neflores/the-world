name: world
description: Shared Flutter module for the World tabletop ecosystem.
version: 0.2.0
publish_to: none

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/art/environments.png
    - assets/art/adventurers.png
    - assets/art/terrain.png
    - assets/art/tavern_hall.png
    - assets/art/world_props.png
    - assets/geography/region.json
